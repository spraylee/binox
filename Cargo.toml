[package]
name = "binox"
version = "0.1.1"
edition = "2021"
description = "GitHub Release 二进制的零配置运行器"
license = "MIT"
repository = "https://github.com/spraylee/binox"
homepage = "https://github.com/spraylee/binox"
readme = "README.md"
publish = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

[dependencies]
flate2 = "1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
